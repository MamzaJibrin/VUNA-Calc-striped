name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Run lint
        run: npm run lint

      - name: Build
        run: |
          mkdir -p dist
          cp -r index.html assets dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vuna-calc-build
          path: |
            dist
            node_modules

  unit-test:
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: vuna-calc-build
          path: .

      - name: Run tests with coverage
        run: npm run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Print coverage summary
        run: |
          if [ -f coverage/coverage-raw.json ]; then
            echo "### Coverage Summary" >> $GITHUB_STEP_SUMMARY
            node -e "
              const cov = require('./coverage/coverage-raw.json');
              const total = cov.reduce((s, e) => s + e.text.length, 0);
              const used = cov.reduce((s, e) => {
                let u = 0;
                for (const r of e.ranges) u += r.end - r.start;
                return s + u;
              }, 0);
              const pct = total ? ((used / total) * 100).toFixed(1) : '0.0';
              console.log('| File | Coverage |');
              console.log('|------|----------|');
              cov.forEach(e => {
                let u = 0;
                for (const r of e.ranges) u += r.end - r.start;
                const fp = e.text.length ? ((u / e.text.length) * 100).toFixed(1) : '0.0';
                console.log('| ' + e.url.split('/').pop() + ' | ' + fp + '% |');
              });
              console.log('| **Total** | **' + pct + '%** |');
              console.log('\\nCoverage: ' + pct + '% (' + used + '/' + total + ' bytes)');
            "
          else
            echo "No coverage data found." >> $GITHUB_STEP_SUMMARY
          fi
